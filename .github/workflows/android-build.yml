name: MeshLink Android Debug Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Install Android SDK command-line tools manually
      - name: Install Android SDK command-line tools
        run: |
          set -euo pipefail
          mkdir -p "${ANDROID_HOME}/cmdline-tools"
          cd "${ANDROID_HOME}/cmdline-tools"
          # Download latest Linux command-line tools from Google
          curl -fsSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          # The extracted folder is "cmdline-tools", move it to "latest"
          mv cmdline-tools latest
          rm cmdline-tools.zip
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/platform-tools" >> $GITHUB_PATH
          echo "${ANDROID_HOME}/build-tools/34.0.0" >> $GITHUB_PATH

      # 4. Accept Android SDK licenses (non-interactive)
      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      # 5. Install Android SDK packages
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      # 6. Verify SDK installation
      - name: Verify SDK installation
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}"
          ls -la "${ANDROID_HOME}/"
          ls -la "${ANDROID_HOME}/cmdline-tools/latest/bin/"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --list_installed | head -20

      # 6. Build Debug APK using project Gradle wrapper
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # 7. Upload Debug APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: meshlink-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error

      # 8. Upload build reports
      - name: Upload Build Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meshlink-build-reports
          path: |
            app/build/reports/
            **/build/reports/
          retention-days: 3
          if-no-files-found: ignore